[tinylora_v2]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/tinylora
  -D TINYLORA_V2=1
  -D RADIO_CLASS=AutoSX126xRadio
  -D WRAPPER_CLASS=NamijiAutoRadioWrapper
  -D ESP32_CPU_FREQ=80
  -D LORA_TX_POWER=22
  -D P_LORA_DIO_1=3
  -D P_LORA_NSS=8
  -D P_LORA_RESET=5
  -D P_LORA_DIO_0=RADIOLIB_NC
  -D P_LORA_DIO_2=RADIOLIB_NC
  -D P_LORA_BUSY=4
  -D P_LORA_SCLK=10
  -D P_LORA_MISO=6
  -D P_LORA_MOSI=7
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  ; -D RADIOLIB_DEBUG_BASIC=1
  ; -D RADIOLIB_DEBUG_SPI=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/tinylora>

