  -D ADMIN_PASSWORD='"TinyLora"'
  -D ROOM_PASSWORD='"password"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${tinylora_v2.build_src_filter}
  +<../examples/simple_room_server>
