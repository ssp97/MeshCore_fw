[env:tinylora_v2_repeater]
extends = tinylora_v2
build_flags =
  ${tinylora_v2.build_flags}
  -D ADVERT_NAME='"TinyLora V2 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${tinylora_v2.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${tinylora_v2.lib_deps}
  ${esp32_ota.lib_deps}

[env:tinylora_v2_companion_radio_usb]
extends = tinylora_v2
build_flags =
  ${tinylora_v2.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${tinylora_v2.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${tinylora_v2.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:tinylora_v2_companion_radio_ble]
extends = tinylora_v2
build_flags =
  ${tinylora_v2.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${tinylora_v2.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${tinylora_v2.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:tinylora_v2_room_server]
extends = tinylora_v2
build_flags =
  ${tinylora_v2.build_flags}
  -D ADVERT_NAME='"TinyLora V2 Room"'
  -D ADVERT_LAT=0.0
