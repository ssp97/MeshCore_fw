[sakurapi_namiji]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/sakurapi_namiji
  -D SAKURAPI_NAMIJI=1
  -D RADIO_CLASS=AutoSX126xRadio
  -D WRAPPER_CLASS=NamijiAutoRadioWrapper
  -D ESP32_CPU_FREQ=80
  -D LORA_TX_POWER=22
  ; -D P_LORA_TX_LED=18
  -D PIN_BOARD_SDA=2
  -D PIN_BOARD_SCL=0
  ;-D PIN_USER_BTN=9
  -D PIN_VBAT_READ=1
  -D P_LORA_DIO_1=20
  -D P_LORA_NSS=7
  -D P_LORA_RESET=10
  -D P_LORA_DIO_0=RADIOLIB_NC
  -D P_LORA_DIO_2=RADIOLIB_NC
  -D P_LORA_BUSY=21
  -D P_LORA_SCLK=6
  -D P_LORA_MISO=9
  -D P_LORA_MOSI=8
  -D SX126X_RXEN=5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ENV_INCLUDE_AHTX0=1
  ; -D RADIOLIB_DEBUG_BASIC=1
  ; -D RADIOLIB_DEBUG_SPI=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/sakurapi_namiji>

[env:sakurapi_namiji_repeater]
extends = sakurapi_namiji
build_flags =
  ${sakurapi_namiji.build_flags}
  ;-D ARDUINO_USB_MODE=1
  ;-D ARDUINO_USB_CDC_ON_BOOT=1
  -D ADVERT_NAME='"SakuraPi Namiji Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${sakurapi_namiji.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${sakurapi_namiji.lib_deps}
  ${esp32_ota.lib_deps}

[env:sakurapi_namiji_repeater_bridge_espnow]
extends = sakurapi_namiji
build_flags =
  ${sakurapi_namiji.build_flags}
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${sakurapi_namiji.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${sakurapi_namiji.lib_deps}
  ${esp32_ota.lib_deps}

[env:sakurapi_namiji_companion_radio_usb]
extends = sakurapi_namiji
build_flags =
  ${sakurapi_namiji.build_flags}
;  -D ARDUINO_USB_MODE=1
;  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${sakurapi_namiji.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${sakurapi_namiji.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:sakurapi_namiji_companion_radio_ble]
extends = sakurapi_namiji
build_flags =
  ${sakurapi_namiji.build_flags}
 -D ARDUINO_USB_MODE=1
 -D ARDUINO_USB_CDC_ON_BOOT=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
 -D MESH_PACKET_LOGGING=1
 -D MESH_DEBUG=1
build_src_filter = ${sakurapi_namiji.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${sakurapi_namiji.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:sakurapi_namiji_room_server]
extends = sakurapi_namiji
build_src_filter = ${sakurapi_namiji.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${sakurapi_namiji.build_flags}
  -D ADVERT_NAME='"SakuraPi Namiji Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"SakuraPi"'
  -D ROOM_PASSWORD='"Namiji"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${sakurapi_namiji.lib_deps}
  ${esp32_ota.lib_deps}

[env:sakurapi_namiji_sensor]
extends = sakurapi_namiji
build_flags =
  ${sakurapi_namiji.build_flags}
  -D ADVERT_NAME='"SakuraPi Namiji Sensor"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D PIN_BOARD_RELAY_CH1=0
  -D PIN_BOARD_RELAY_CH2=1
  -D PIN_BOARD_DIGITAL_IN=19
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${sakurapi_namiji.build_src_filter}
  +<../examples/simple_sensor>
lib_deps =
  ${sakurapi_namiji.lib_deps}
  ${esp32_ota.lib_deps}
